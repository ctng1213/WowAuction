<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ahsync-token" content="__AHSYNC_TOKEN__">
<meta name="referrer" content="no-referrer">
<title>AHSync Dashboard</title>
<!--
  The AHSync dashboard (SPEC §3.5), served by ahsync/web/server.py at http://localhost:8765.
  The look follows docs/mockups/dashboard.html. Every number comes formatted from the full
  refresh (engine/views.py); this page only displays, sorts by each row's `sort` values and
  hides rows by their fields. It never parses or computes numbers (SPEC §8.5).
-->
<style>
  /* WoW-themed dark palette: stone panels, gold trim, Blizzard item-quality colours. Always dark. */
  :root {
    color-scheme: dark;
    --bg: #0e0d0b; --surface: #181612; --surface-2: #221f19; --border: #3d3424; --border-hi: #8a6d2f;
    --text: #ece3cc; --muted: #9b917b; --accent: #ffd100; --accent-bg: #2b2210;
    --pos: #3ddc4f; --neg: #ff4a3d; --amber: #ffb02e; --info: #69ccf0;
    --q0: #9d9d9d; --q1: #ffffff; --q2: #1eff00; --q3: #2f8cff; --q4: #b55cff; --q5: #ff8000;
    --serif: "Friz Quadrata TT", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: radial-gradient(ellipse at 50% -10%, #2a2214 0%, var(--bg) 55%) fixed, var(--bg); }
  a { color: inherit; text-decoration: underline; text-decoration-color: #4a3f2a; text-underline-offset: 2px; }
  a:hover { text-decoration-color: currentColor; }

  .top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap;
         background: linear-gradient(#211c13, #15120d); border-bottom: 2px solid var(--border-hi); box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .brand { font: 700 19px var(--serif); color: var(--text); letter-spacing: .5px; text-shadow: 0 1px 2px #000; }
  .brand span { color: var(--accent); }
  .select { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: #0b0a08; font-size: 13px; color: var(--text); }
  select.select, input.select { font-family: inherit; }
  .top .grow { flex: 1; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: #0b0a08; white-space: nowrap; }
  .pill.ok { color: var(--pos); border-color: #2c6b32; } .pill.warn { color: var(--amber); border-color: #7a5a1b; } .pill.gold { color: var(--accent); border-color: var(--border-hi); }

  .layout { display: grid; grid-template-columns: 190px 1fr; min-height: calc(100vh - 54px); }
  nav { background: linear-gradient(90deg, #15120d, #110f0b); border-right: 1px solid var(--border); padding: 12px 8px; }
  nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 7px 12px; margin: 2px 0; border: 1px solid transparent; border-radius: 4px;
               background: none; color: var(--text); font: 15px var(--serif); cursor: pointer; }
  nav button:hover { background: var(--surface-2); border-color: var(--border); }
  nav button[aria-selected="true"] { background: linear-gradient(90deg, #3a2c10, #1d170c); color: var(--accent); border-color: var(--border-hi);
                                     box-shadow: inset 3px 0 0 var(--accent); }
  nav .soon { color: var(--muted); font: 11px system-ui, sans-serif; }
  main { padding: 20px 24px 48px; min-width: 0; }
  h1 { font: 24px var(--serif); color: var(--accent); margin: 0 0 4px; text-shadow: 0 1px 3px #000; }
  .lede { color: var(--muted); margin: 0 0 16px; max-width: 760px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px #000, 0 3px 12px rgba(0,0,0,.5); }
  .card-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: linear-gradient(#241f16, #1a1711); }
  .card-h b { flex: 1; font: 15px var(--serif); color: var(--accent); font-weight: normal; }
  .filters { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  .filters .search { min-width: 180px; flex: 1; max-width: 260px; }
  .filters label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .scrollx { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: #d9b54a; padding: 8px 12px; border-bottom: 1px solid var(--border-hi); white-space: nowrap; background: #120f0b; letter-spacing: .3px; }
  th.sort { cursor: pointer; user-select: none; }
  th[title] { text-decoration: underline dotted #6b5a32; text-underline-offset: 3px; }
  th.sort::after { content: " ↕"; opacity: .5; } th.sorted::after { content: " ↓"; opacity: 1; } th.sorted.asc::after { content: " ↑"; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(even) td { background: rgba(255,255,255,.015); }
  tbody tr:hover td { background: #2a2416; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); } .amber { color: var(--amber); }
  .sub { display: block; color: var(--muted); font-size: 12px; white-space: normal; max-width: 520px; }
  .q0 { color: var(--q0); } .q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); } .q5 { color: var(--q5); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot.h { background: var(--pos); } .dot.m { background: var(--amber); } .dot.l { background: var(--muted); }
  /* Blizzard-style red panel button with gold text */
  .btn { display: inline-block; padding: 3px 12px; border: 1px solid #000; border-radius: 3px; font-size: 12px; cursor: pointer; color: var(--accent);
         background: linear-gradient(#8a1a14, #4d0c09); box-shadow: inset 0 0 0 1px #b2392f, 0 1px 2px #000; text-shadow: 0 1px 1px #000; font-family: inherit; }
  .btn:hover { background: linear-gradient(#a3221a, #5e0f0b); }
  .btn.primary { background: linear-gradient(#6b5420, #3a2c10); box-shadow: inset 0 0 0 1px #c9a64a, 0 1px 2px #000; }
  .btn:disabled { opacity: .6; cursor: default; }

  .act { display: inline-block; min-width: 46px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .4px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
  .act.buy { color: #69ccf0; } .act.post { color: var(--accent); } .act.de { color: #b55cff; } .act.craft { color: #ff8000; } .act.vendor { color: #9d9d9d; } .act.mail { color: var(--info); } .act.hold { color: var(--amber); }
  .week { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding: 12px; }
  .day { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; min-height: 160px; box-shadow: inset 0 0 0 1px #000; }
  .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px #000, 0 0 12px rgba(255,209,0,.15); }
  .day h4 { margin: 0; font: 15px var(--serif); color: var(--accent); display: flex; justify-content: space-between; }
  .day .tot { font-size: 12px; margin-bottom: 8px; }
  .chip { border: 1px solid var(--border); border-left: 3px solid var(--border-hi); border-radius: 4px; padding: 5px 7px; margin-bottom: 6px; font-size: 12px; background: #0f0d0a; }
  .chip.buy { border-left-color: #69ccf0; } .chip.post { border-left-color: var(--accent); } .chip.de { border-left-color: #b55cff; } .chip.craft { border-left-color: #ff8000; } .chip.mail { border-left-color: var(--info); } .chip.hold { border-left-color: var(--amber); border-style: dashed; border-left-style: solid; }
  .chip .t { color: var(--muted); } .chip .who { float: right; color: var(--muted); } .chip.done { opacity: .6; } .chip.done .t::before { content: "✓ "; color: var(--pos); }
  .chip.missed { border-left-color: var(--neg); opacity: .8; } .chip.missed .t::before { content: "✗ missed "; color: var(--neg); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 0 12px 12px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 12px 14px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 10px; }
  .alert.warn { border-left: 4px solid var(--amber); } .alert.bad { border-left: 4px solid var(--neg); } .alert.info { border-left: 4px solid var(--info); }
  .alert .grow { flex: 1; }
  .empty { padding: 28px 14px; text-align: center; color: var(--muted); }
  /* Inventory: tiles, the selected row and the item detail (heatmaps, windows, breakdowns) */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .prof { padding: 6px 14px; }
  .tile { background: linear-gradient(#1f1b14, #14120e); border: 1px solid var(--border); border-top: 2px solid var(--border-hi); border-radius: 6px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .tile .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .d { color: var(--muted); font-size: 12px; }
  tr[data-select] { cursor: pointer; }
  tr.selected td { background: #2a2416; } tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; }
  .detail .h { color: var(--muted); font-size: 12px; margin: 12px 0 4px; } .detail .h:first-child { margin-top: 0; }
  .window { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; margin-bottom: 4px; border: 1px solid var(--border); border-radius: 4px; background: #0f0d0a; flex-wrap: wrap; }
  .window .rank { font: 16px var(--serif); color: var(--accent); width: 14px; }
  .window b { font-weight: 600; min-width: 130px; }
  .breakdown div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .breakdown span { color: var(--muted); } .breakdown b { font-weight: 600; text-align: right; }
  .heat { display: grid; grid-template-columns: 30px repeat(24, 1fr); gap: 1px; font-size: 10px; }
  .heat div { height: 13px; } .heat .lbl { color: var(--muted); height: auto; }
  .heat.price { --c: var(--accent); } .heat.sales { --c: var(--pos); } .heat.supply { --c: var(--info); }
  .heat .h0 { background: color-mix(in srgb, var(--c) 8%, transparent); } .heat .h1 { background: color-mix(in srgb, var(--c) 30%, transparent); }
  .heat .h2 { background: color-mix(in srgb, var(--c) 52%, transparent); } .heat .h3 { background: color-mix(in srgb, var(--c) 76%, transparent); }
  .heat .h4 { background: var(--c); } .heat .hn { background: repeating-linear-gradient(45deg, #2a2620 0 2px, transparent 2px 4px); }
  [hidden] { display: none !important; }
  /* Portfolio: position stage badges, the Funded status, greyed alternatives, the red line and card footers */
  .st { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px; border: 1px solid currentColor; white-space: nowrap; }
  .st.acq { color: #69ccf0; } .st.proc { color: #ff8000; } .st.hold { color: var(--amber); } .st.ready { color: var(--pos); }
  .st.listed { color: var(--accent); } .st.partial { color: var(--info); } .st.recon { color: var(--neg); } .st.funded { color: var(--pos); } .st.done { color: var(--muted); }
  tr.excluded td:not(.why) { opacity: .45; }
  .foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--border-hi); background: #120f0b; font-size: 13px; }
  .foot.note { border-top-color: var(--border); background: none; color: var(--muted); font-size: 12px; }
  .fresh { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  tr.cut td { color: var(--neg); border-top: 2px solid var(--neg); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; padding: 3px 12px; background: none !important; letter-spacing: .3px; }
  tr.total td { font-weight: 650; border-top: 1px solid var(--border-hi); }
  .tile select { font: inherit; color: var(--text); background: #0b0a08; border: 1px solid var(--border-hi); border-radius: 4px; padding: 0 4px; cursor: pointer; }
  .pf .card + .card, .pf .card + .alert, .pf .alert + .card { margin-top: 14px; }
  .pf .tiles { padding: 0 0 12px; border-bottom: 0; }
  /* Gathering: 12 columns fit a 1280 px window (tighter cells; headers and Category may wrap), as in the mockup */
  .ga th, .ga td { padding: 6px 7px; } .ga th { white-space: normal; vertical-align: bottom; }
  .ga td:nth-child(2) { white-space: normal; min-width: 70px; } .ga .sub { max-width: 220px; }
  .breakdown span.amber { color: var(--amber); } .breakdown span.pos { color: var(--pos); }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .detail { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 6px; }
    nav button { width: auto; white-space: nowrap; }
    nav .soon { display: none; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">AH<span>Sync</span></div>
  <label>Market: <select class="select" id="market" aria-label="Market"></select></label>
  <span class="grow"></span>
  <span class="pill gold" id="goldpill" title="Gold in hand across your characters at the last portfolio snapshot. Hidden on Rules, Characters and Status" hidden></span>
  <span class="pill" id="built" title="Numbers are recomputed at start, once a day after daily_refresh_time, or when you press Refresh now." hidden></span>
  <button class="btn primary" id="refresh" type="button" title="Full refresh: recompute every statistic, chance and the plan (about a minute)">⟳ Refresh now</button>
  <span class="pill" id="notice" hidden></span>
</div>

<div class="layout">
  <nav id="nav" role="tablist"></nav>
  <main id="main"></main>
</div>

<script>
'use strict';
// Per-run write token, embedded by the server (SPEC §3.5 Security). A page loaded before a restart
// holds an old token: its next write gets 403 and we ask for a reload (SEC7).
const TOKEN = document.querySelector('meta[name="ahsync-token"]').content;

// ---------- helpers (display only: no arithmetic on numbers, SPEC §8.5) ----------
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const QUALITIES = [0, 1, 2, 3, 4, 5];
const qualityClass = q => QUALITIES.includes(q) ? `q${q}` : 'q1';
// SPEC GAP: §3.5 says item names link to auctionhouse.fyi but gives no per-item URL; like the mockup, link to the site.
const item = (name, quality) => `<a class="${qualityClass(quality)}" href="https://auctionhouse.fyi/" target="_blank" rel="noopener noreferrer" title="Open on auctionhouse.fyi">${esc(name)}</a>`;
const DOTS = { high: 'h', medium: 'm', low: 'l' };
// The market activity columns (SPEC §3.5): Chance (the dot inside it is the confidence; hover shows the exact %),
// Est. Sales/Day, Current Supply, Supply/Volume. Every cell comes formatted from engine/views.py.
const MARKET_COLS = [['Chance', 1, 'chance'], ['Est. Sales/Day', 1, 'sales'], ['Current Supply', 1, 'supply'], ['Supply/Volume', 1, 'days']];
const marketCells = r => {
  const dot = DOTS[r.dot];
  const title = dot && r.confidence !== null && r.confidence !== undefined
    ? ` title="Confidence ${esc(r.confidence)}%: how much the data behind this chance can be trusted"` : '';
  return `<td class="num"${title}>${dash(r.chance)}${dot ? ` <span class="dot ${dot}"></span>` : ''}${r.chance_note ? `<span class="sub">${esc(r.chance_note)}</span>` : ''}</td>` +
         `<td class="num">${dash(r.sales)}</td><td class="num">${dash(r.supply)}</td><td class="num">${dash(r.days)}</td>`;
};
// Days of supply, compared with the engine's sort key (tenths of a day): option values are already in tenths.
const daysFilter = { id: 'maxDays', label: 'Max days of supply', options: [['', 'Any'], ['10', '1 day'], ['30', '3 days'], ['70', '7 days']],
  test: (r, v) => v === '' || (r.sort.days >= 0 && r.sort.days <= Number(v)) };
const profitCell = r => `<td class="num"><span class="${r.profit_class === 'pos' ? 'pos' : 'neg'}">${esc(r.profit)}</span></td>`;
const riskCell = r => `<td class="num"><span class="${r.risk_amber ? 'amber' : 'muted'}">${esc(r.risk)}</span></td>`;
const dash = v => v === '—' ? '<span class="muted">—</span>' : esc(v);
const sourceClass = s => String(s).startsWith('Owned') ? 'pos' : String(s).startsWith('AH') ? 'amber' : '';
const ACTIONS = ['buy', 'post', 'de', 'craft', 'vendor', 'mail', 'hold'];
const act = a => ACTIONS.includes(a) ? `<span class="act ${a}">${a === 'de' ? 'DE' : a.toUpperCase()}</span>` : esc(a);
// Money text from the engine starts with "+" or "−" when it has a sign; its colour follows that sign.
const signed = text => `<span class="${String(text).startsWith('+') ? 'pos' : String(text).startsWith('−') ? 'neg' : 'muted'}">${esc(text)}</span>`;
const netCell = r => `<td class="num">${r.net === '—' ? '<span class="muted">—</span>' : signed(r.net)}</td>`;
const skipButton = r => r.status === 'pending' ? `<button class="btn" type="button" data-skip="${esc(r.id)}">Skip</button>` : '';
const STATUS_CLASS = { done: ' done', missed: ' missed', skipped: ' done', partial: '' };
// A chain row's lines (D62, D66): its mat buys, intermediate crafts and incoming mail, then when it sells.
const chainLines = (r, open, close) => (r.lines || []).map(l => `${open}${esc(l)}${close}`).join('');
// One action as a Week chip (SPEC §3.4C): time, character (D65), action, item, money, net, chance, the engine's note
// and the chain's lines.
const chip = r => `<div class="chip ${esc(r.action)}${STATUS_CLASS[r.status] || ''}"><span class="t">${esc(r.time)}</span> ${act(r.action)} <span class="who">${esc(r.character)}</span><br>` +
  `${item(r.item, r.quality)} <span class="muted">×${esc(r.qty)}</span><br><span class="muted">${dash(r.each)} each · ${dash(r.total)}</span><br>` +
  `${r.net === '—' ? '' : signed(r.net)}${r.chance !== '—' ? ` <span class="muted">· ${esc(r.chance)} chance</span>` : ''}` +
  `${r.note ? `<br><span class="muted">${esc(r.note)}</span>` : ''}${chainLines(r, '<br><span class="muted">', '</span>')}` +
  `${r.record ? `<br><span class="muted">${esc(r.record)}</span>` : ''}</div>`;
// Your own sell record under a row (SPEC §3.3.3, D42), as the engine wrote it.
const recordSub = r => r.record ? `<span class="sub">${esc(r.record)}</span>` : '';
// Today's Needs a decision section (D43): items flagged not selling, with Blacklist and Keep (POST /api/rule, SEC8).
const decisionsHtml = rows => !(rows || []).length ? '' :
  `<div class="card-h" style="border-top:1px solid var(--border)"><b>Needs a decision</b><span class="muted">not selling: no more buys or crafts until you decide</span></div>` +
  `<div class="scrollx"><table><tbody>${rows.map(d => `<tr><td>${item(d.item, d.quality)}<span class="sub">${esc(d.record)}</span></td>` +
  `<td><span class="pill warn">NOT SELLING</span></td>` +
  `<td><select class="btn" data-rule-key="${esc(d.key)}" title="Blacklist it"><option value="">Blacklist…</option>` +
  `<option value="no_buy">Don't buy or craft</option><option value="ignore">Ignore completely</option></select> ` +
  `<button class="btn" type="button" data-rule-key="${esc(d.key)}" data-rule="keep" title="Keep selling it: its record starts fresh">Keep</button></td></tr>`).join('')}</tbody></table></div>`;
// Inventory: tiles and the item detail, all text from engine/inventory_view.py and engine/item_detail.py.
const tilesHtml = tiles => `<div class="tiles">${(tiles || []).map(([k, v, d]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join('')}</div>`;
const HOUR_LABELS = ['0', '', '', '', '', '', '6', '', '', '', '', '', '12', '', '', '', '', '', '18', '', '', '', '', ''];
const LEVEL_CLASS = { 0: 'h0', 1: 'h1', 2: 'h2', 3: 'h3', 4: 'h4' };
const heatHtml = (rows, kind) => `<div class="heat ${kind}"><div class="lbl"></div>${HOUR_LABELS.map(h => `<div class="lbl">${h}</div>`).join('')}` +
  (rows || []).map(r => `<div class="lbl">${esc(r.day)}</div>` + r.cells.map(c => `<div class="${LEVEL_CLASS[c.level] || 'hn'}" title="${esc(c.title)}"></div>`).join('')).join('') + '</div>';
const breakdown = lines => `<div class="breakdown">${lines.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
const detailHtml = d => !d ? '<div class="empty" style="border-top:1px solid var(--border)">No market data for this item yet.</div>' :
  `<div class="card-h" style="border-top:1px solid var(--border)"><b>${esc(d.name)}: when it sells best</b><span class="muted">${esc(d.summary)}</span></div><div class="detail"><div>` +
  `<div class="h">Best selling windows (forecast for the coming week, local time)</div>` +
  (d.windows.length ? d.windows.map((w, i) => `<div class="window"><span class="rank">${i + 1}</span><b>${esc(w.when)}</b><span class="${esc(w.uplift_class)}">${esc(w.uplift)}</span><span class="muted">${esc(w.strength)}</span></div>`).join('')
    : '<div class="muted">No windows yet: too little weekly data. The plan posts now.</div>') +
  `<div class="h">Three selling answers, kept apart</div>${breakdown([['Highest expected price', d.answers.price], ['Most estimated sales', d.answers.sales], ["Best risk-adjusted window (the plan's)", d.answers.best]])}` +
  `<div class="h">Market activity</div>${breakdown(d.activity)}</div><div>` +
  `<div class="h">Price by hour of the week (<code>how</code>), local time</div>${heatHtml(d.heat.price, 'price')}` +
  `<div class="h">Estimated sales by hour (<code>sales_how</code>)</div>${heatHtml(d.heat.sales, 'sales')}` +
  `<div class="h">Listed supply by hour (<code>supply_how</code>)</div>${heatHtml(d.heat.supply, 'supply')}` +
  `<div class="h">Hover a cell for its ratio to the item's normal level and the weeks of data behind it. Striped = no data.</div></div></div>`;
// Status: alerts and cards, every text from engine/status_view.py.
const ALERT_CLASS = { error: 'bad', warn: 'warn', info: 'info' };
const VALUE_CLASS = { amber: 'amber', muted: 'muted', pos: 'pos', neg: 'neg' };
const statusCard = c => `<div class="card"><div class="card-h"><b>${esc(c.title)}</b>${c.badge ? `<span class="pill ${c.badge_class === 'ok' || c.badge_class === 'warn' || c.badge_class === 'gold' ? c.badge_class : ''}">${esc(c.badge)}</span>` : ''}</div>` +
  `<dl class="kv">${c.lines.map(([k, v, cls]) => `<dt>${esc(k)}</dt><dd class="${VALUE_CLASS[cls] || ''}">${esc(v)}</dd>`).join('')}</dl></div>`;
// Status: the sell-probability calibration section (SPEC §8.8); every text and width comes from engine/status_view.py.
const calBar = (pct, color) => `<div class="bar" style="width:160px"><i style="width:${Number(pct)}%;background:${color}"></i></div>`;
const calibrationHtml = c => !c ? '<div class="empty">Sell-probability calibration appears here once your posts are tracked to their outcome.</div>' :
  `<h3 style="padding:0 12px">Sell-probability calibration</h3><div style="padding:0 12px">` +
  c.warnings.map(w => `<div class="alert warn"><b>Off target</b><span class="grow">${esc(w)}</span></div>`).join('') +
  (!c.rows.length ? '' : `<div class="card"><div class="card-h"><b>${esc(c.title)}</b><span class="muted">${esc(c.brier)}</span></div><table><thead><tr>` +
  `<th>Predicted chance</th><th class="num">Posts</th><th class="num">Predicted</th><th class="num">Actually sold</th><th class="num">Off by</th><th></th></tr></thead><tbody>` +
  c.rows.map(r => `<tr><td>${esc(r.bucket)}</td><td class="num">${esc(r.posts)}</td><td class="num">${esc(r.predicted)}</td>` +
    `<td class="num ${r.bad ? 'neg' : ''}">${esc(r.actual)}</td><td class="num ${r.bad ? 'neg' : 'muted'}">${esc(r.off)}</td>` +
    `<td>${calBar(r.predicted_pct, 'var(--muted)')}${calBar(r.actual_pct, r.bad ? 'var(--neg)' : 'var(--pos)')}</td></tr>`).join('') +
  `</tbody></table></div>`) +
  (c.profit ? `<div class="card" style="padding:8px 12px">${esc(c.profit)}</div>` : '') + `</div>`;
const totalsList = obj => Object.entries(obj || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${signed(v)}</dd>`).join('');

// ---------- Portfolio (SPEC §3.5, §3.4D): every cell and text comes from engine/portfolio_view.py ----------
const PF_COLS_A = [['Item', 0], ['Qty', 1], ['Character', 0], ['Status', 0], ['Paid', 1], ['Cost basis left', 1], ['Est. net', 1],
                   ['Sell window', 0], ['Next action', 0]];
const PF_COLS_B = [['Strategy', 0], ['Action', 0], ['Item', 0], ['Qty', 1], ['Each', 1], ['Total', 1], ['Expected net', 1],
                   ...MARKET_COLS, ['Risk', 1], ['Character', 0], ['Status', 0], ['', 0]];
const PF_COLS_C = [['Strategy', 0], ['Item', 0], ['Qty', 1], ['Buy when', 0], ['Process', 0], ['Sell when', 0], ['Gold needed', 1],
                   ['Materials', 0], ['Expected net', 1], ['Adjusted', 1], ...MARKET_COLS, ['Character', 0], ['Status', 0], ['', 0]];
const PF_COLS_POOL = [['#', 1], ['Item', 0], ['Sells', 0], ['Adjusted', 1], ['Expected net', 1], ['Gold needed', 1], ['Cash', 1],
                      ['Profit %', 1], ['Left', 1]];
const STAGE_CLASSES = ['acq', 'proc', 'hold', 'ready', 'listed', 'partial', 'done', 'recon'];
const PF_STAGES = [['acq', 'Acquiring'], ['proc', 'Processing'], ['hold', 'Holding'], ['ready', 'Ready to sell'], ['listed', 'Listed'],
                   ['partial', 'Partially sold'], ['recon', 'Needs reconciliation']];
const FOOT_CLASSES = ['pos', 'neg', 'muted'];
const pfTable = (cols, help, rows) => `<div class="scrollx"><table><thead><tr>${cols.map(([t, num]) =>
  `<th class="${num ? 'num' : ''}"${help[t] ? ` title="${esc(help[t])}"` : ''}>${esc(t)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const pfFoot = foot => `<div class="foot">${(foot || []).map(([t, c]) => `<span class="${FOOT_CLASSES.includes(c) ? c : ''}">${esc(t)}</span>`).join('<span class="muted">·</span>')}</div>`;
const pfNote = text => text ? `<div class="foot note">${esc(text)}</div>` : '';
const pfCard = (title, note, body) => `<div class="card"><div class="card-h"><b>${esc(title)}</b>${note}</div>${body}</div>`;
const pfNet = text => text === '—' ? '<span class="muted">—</span>' : signed(text);
const pfCut = (span, text) => `<tr class="cut"><td colspan="${span}">${esc(text)}</td></tr>`;
// The Status cell (SPEC §3.4D.6): the Funded badge, or the reason with its detail line.
const pfStatus = r => `<td class="why">${r.status === 'funded' ? '<span class="st funded">Funded</span>'
  : `<span class="${r.status_class === 'neg' ? 'neg' : 'amber'}">${esc(r.status)}</span>${r.detail ? `<span class="sub">${esc(r.detail)}</span>` : ''}`}</td>`;
const pfSkip = r => r.status === 'funded' && r.id ? `<button class="btn" type="button" data-skip="${esc(r.id)}">Skip</button>` : '';
const pfOpen = r => `<tr${r.excluded ? ' class="excluded"' : ''}>`;
const pfPositionRow = r => `<tr><td>${item(r.item, r.quality)}${r.note ? `<span class="sub">${esc(r.note)}</span>` : ''}</td><td class="num">${esc(r.qty)}</td>` +
  `<td>${esc(r.character)}</td><td><span class="st ${STAGE_CLASSES.includes(r.state_class) ? r.state_class : 'hold'}">${esc(r.state)}</span></td>` +
  `<td class="num">${esc(r.paid)}${r.paid_note ? ` <span class="muted">${esc(r.paid_note)}</span>` : ''}</td><td class="num">${esc(r.cost_left)}</td>` +
  `<td class="num">${pfNet(r.net)}</td><td>${dash(r.window)}</td><td>${dash(r.next)}</td></tr>`;
const pfTodayRow = r => `${pfOpen(r)}<td>${esc(r.strategy)}</td><td>${act(r.action)}</td><td>${item(r.item, r.quality)}${chainLines(r, '<span class="sub">', '</span>')}</td>` +
  `<td class="num">${esc(r.qty)}</td><td class="num">${dash(r.each)}</td><td class="num">${dash(r.total)}</td><td class="num">${pfNet(r.net)}</td>` +
  `${marketCells(r)}${riskCell(r)}<td>${esc(r.character)}</td>${pfStatus(r)}<td>${pfSkip(r)}</td></tr>`;
const pfWeekRow = r => `${pfOpen(r)}<td>${esc(r.strategy)}</td><td>${item(r.item, r.quality)}</td><td class="num">${esc(r.qty)}</td><td>${dash(r.buy_when)}</td>` +
  `<td>${dash(r.process)}</td><td>${esc(r.sell_when)}${r.sale_note ? `<span class="sub">${esc(r.sale_note)}</span>` : ''}</td><td class="num">${esc(r.gold)}</td>` +
  `<td class="muted">${dash(r.materials)}</td><td class="num">${pfNet(r.net)}</td><td class="num">${pfNet(r.adjusted)}<span class="sub">${esc(r.wait_note)}</span></td>` +
  `${marketCells(r)}<td>${esc(r.character)}</td>${pfStatus(r)}<td>${pfSkip(r)}</td></tr>`;
const pfPoolCells = r => `<td>${item(r.item, r.quality)}</td><td>${esc(r.sells)}</td><td class="num">${esc(r.adjusted)}</td><td class="num">${pfNet(r.net)}</td>` +
  `<td class="num">${esc(r.gold)}</td><td class="num">${esc(r.cash)}</td><td class="num">${esc(r.pct)}${r.pct_note ? `<span class="sub">${esc(r.pct_note)}</span>` : ''}</td>`;
// The funding card ("How the pool was funded", D78): rows by adjusted profit, the total, the red line, the first row left out.
const pfPool = (p, help) => pfTable(PF_COLS_POOL, help, [
  ...p.rows.map(r => `<tr><td class="num">${esc(r.n)}</td>${pfPoolCells(r)}<td class="num">${esc(r.left)}</td></tr>`),
  `<tr class="total"><td></td><td>${esc(p.total.label)}${p.total.note ? `<span class="sub">${esc(p.total.note)}</span>` : ''}</td><td class="muted">${esc(p.total.rows)}</td>` +
    `<td class="num">${esc(p.total.adjusted)}</td><td class="num">${pfNet(p.total.net)}</td><td class="num">${esc(p.total.gold)}</td><td class="num">${esc(p.total.cash)}</td>` +
    `<td class="num">${esc(p.total.pct)}</td><td class="num">${esc(p.total.left)}</td></tr>`,
  pfCut(PF_COLS_POOL.length, p.cut),
  ...(p.first_excluded ? [`<tr class="excluded"><td></td>${pfPoolCells(p.first_excluded)}<td class="num why"><span class="amber">${esc(p.first_excluded.left)}</span></td></tr>`] : [])]);
// The Risk tolerance tile is a dropdown (SEC11, D79): its option values come from the payload, posted as they are.
const pfRiskSelect = risk => `<select data-risk aria-label="Risk tolerance" title="Changing it re-runs the allocation">${risk.options.map((pct, i) =>
  `<option value="${esc(risk.values[i])}"${pct === risk.selected ? ' selected' : ''}>${esc(pct)}%</option>`).join('')}</select>`;
const pfTiles = d => `<div class="tiles">${(d.tiles || []).map(t => `<div class="tile"><div class="k">${esc(t.label)}</div><div class="v">${t.risk ? pfRiskSelect(d.risk) : esc(t.value)}` +
  `${t.of ? ` <span class="muted" style="font-size:13px;font-weight:400">${esc(t.of)}</span>` : ''}</div><div class="d">${esc(t.detail)}</div></div>`).join('')}</div>`;
const PF_MIN_STEPS = [['0', '0%'], ['25', '25%'], ['50', '50%'], ['75', '75%']];
// Sections B and C, then the funding card; or, when nothing new is funded, one alert in their place (SPEC §3.4D.7, D77).
const pfLists = (d, values, help) => {
  if (d.empty) return `<div class="alert bad"><span class="grow"><b>${esc(d.empty.title)}</b><span class="sub">${esc(d.empty.text)}</span></span></div>`;
  const b = (d.today.by_min || {})[values.minChance] || { funded: [], excluded: [], cut: '', foot: [], hidden: 0 };
  const min = `<label class="muted">${b.hidden ? `${esc(b.hidden)} hidden · ` : ''}Min chance to sell <select class="select" data-filter="minChance">` +
    PF_MIN_STEPS.map(([v, t]) => `<option value="${v}"${v === values.minChance ? ' selected' : ''}>${t}</option>`).join('') + '</select></label>';
  const w = d.week;
  return pfCard('B. Top opportunities today', `<span class="muted">realized within the immediate window: no premium</span>${min}`,
      pfTable(PF_COLS_B, help, [...b.funded.map(pfTodayRow), pfCut(PF_COLS_B.length, b.cut), ...b.excluded.map(pfTodayRow)]) + pfFoot(b.foot) + pfNote(d.today.note)) +
    pfCard('C. Top opportunities, next 7 days', '<span class="muted">ranked by adjusted profit, in the same pool as Today</span>',
      pfTable(PF_COLS_C, help, [...w.funded.map(pfWeekRow), pfCut(PF_COLS_C.length, w.cut), ...w.excluded.map(pfWeekRow)]) + pfFoot(w.foot) + pfNote(w.note)) +
    pfCard('How the pool was funded', '<span class="muted">best adjusted profit first, Today and the week together</span>', pfPool(d.pool, help));
};
const pfPage = (d, values) => {
  const help = d.help || {}, a = d.positions || { rows: [], foot: [], note: '' };
  return `<div class="pf" style="padding:12px">${pfTiles(d)}<div class="fresh">${esc(d.fresh)}</div>` +
    pfCard('A. Active positions', `<span class="muted">${esc(a.summary)}</span>`,
      (a.rows.length ? pfTable(PF_COLS_A, help, a.rows.map(pfPositionRow)) : '<div class="empty">No open positions.</div>') + pfFoot(a.foot) +
      `<div class="foot note">Stages: ${PF_STAGES.map(([cls, name]) => `<span class="st ${cls}">${name}</span>`).join(' ')} · ${esc(a.note)}</div>`) +
    pfLists(d, values, help) + '</div>';
};

// ---------- Gathering (SPEC §3.4E, §3.5): every cell, note, footer and option comes from engine/gathering_view.py ----------
// Columns in the mockup's order: [header, numeric?, sort key in row.sort (or null)]. Rows with a null key sort last both ways.
const GA_COLS = [['Item', 0, null], ['Category', 0, null], ['Skill', 1, 'skill'], ['AH Price', 1, 'price'], ['AH Qty', 1, 'qty'],
                 ['Median 30d', 1, null], ['Deviation', 1, 'deviation'], ['Items/hr', 1, 'rate'], ['Character', 0, null],
                 ['Net gold/hr', 1, 'net'], ['Sell window', 0, null], ['Sell window price', 1, 'window_price']];
const GA_CLASSES = ['amber', 'muted', 'pos', 'neg'];
const gaClass = c => GA_CLASSES.includes(c) ? c : '';
const gaSegments = segs => (segs || []).map(([t, c]) => `<span class="${gaClass(c)}">${esc(t)}</span>`);
const gaOptions = (options, v) => (options || []).map(([val, text]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(text)}</option>`).join('');
// "Only what <character> can gather": on by default once a character is picked, remembered per character.
const gaOnly = values => !!values.character && values['only_' + values.character] !== '0';
// The filters only compare the row's engine-made fields (cats, price, name, skill, eligible) with the picked options.
function gaShown(d, rows, values) {
  const skill = (d.filters.skill || []).find(([v]) => v === (values.skill || ''));
  const min = values.minPrice === 'custom' ? (values.minPriceCustom || '') : (values.minPrice || '');
  const text = String(values.search || '').toLowerCase(), only = gaOnly(values);
  return rows.filter(r => r.cats.some(c => values['cat_' + c] !== '0') &&
    (min === '' || (r.price !== null && r.price >= Number(min))) &&
    (!text || String(r.name).toLowerCase().includes(text)) && (!only || r.eligible) &&
    (!skill || skill[2] === null || (r.skill !== null && r.skill >= skill[2] && r.skill <= skill[3])));
}
const gaFilters = (d, view, values) => `<div class="filters">` +
  d.filters.categories.map(c => `<label><input type="checkbox" data-gcat="${esc(c)}"${values['cat_' + c] === '0' ? '' : ' checked'}> ${esc(c)}</label>`).join('') +
  `<label>Min AH price <select class="select" data-filter="minPrice">${gaOptions(d.filters.min_price, values.minPrice || '')}</select></label>` +
  (values.minPrice === 'custom' ? `<input class="select" type="text" inputmode="numeric" data-filter="minPriceCustom" placeholder="copper" aria-label="Min AH price in copper" style="width:80px" value="${esc(values.minPriceCustom || '')}">` : '') +
  `<input class="select search" type="search" data-filter="search" placeholder="${esc(d.filters.search)}" value="${esc(values.search || '')}">` +
  `<label>Character <select class="select" data-filter="character">${gaOptions(d.characters, values.character || '')}</select></label>` +
  `<label title="${esc(view.toggle.title)}"${view.toggle.disabled ? ' class="muted"' : ''}><input type="checkbox" data-gonly${gaOnly(values) ? ' checked' : ''}${view.toggle.disabled ? ' disabled' : ''}> ${esc(view.toggle.label)}</label>` +
  `<label>Skill <select class="select" data-filter="skill">${gaOptions(d.filters.skill, values.skill || '')}</select></label></div>`;
const gaSkill = r => r.skill_text === '—' ? dash('—') : `<span class="${r.skill_amber ? 'amber' : ''}" title="${esc(r.skill_title)}">${esc(r.skill_text)}</span>` +
  (r.skill_sub ? `<span class="sub">${esc(r.skill_sub)}</span>` : '');
const gaRow = (r, selected) => `<tr data-select="${esc(r.key)}"${String(r.key) === selected ? ' class="selected"' : ''}><td>${item(r.item, r.quality)}${r.note ? `<span class="sub">${esc(r.note)}</span>` : ''}</td>` +
  `<td>${esc(r.category)}</td><td class="num">${gaSkill(r)}</td><td class="num" title="${esc(r.price_title)}">${dash(r.ah_price)}</td><td class="num">${dash(r.qty)}</td>` +
  `<td class="num">${dash(r.median)}</td><td class="num"><span class="${gaClass(r.deviation_class)}">${dash(r.deviation)}</span></td>` +
  `<td class="num${r.fallback ? ' muted' : ''}" title="${esc(r.rate_title)}">${dash(r.rate)}${r.fallback ? ' <span class="st" style="color:var(--muted)">Fallback</span>' : ''}${r.rate_sub ? `<span class="sub">${esc(r.rate_sub)}</span>` : ''}</td>` +
  `<td class="${r.fallback ? 'muted' : ''}">${dash(r.character)}</td>` +
  `<td class="num${r.fallback ? ' muted' : ''}"${r.net_title ? ` title="${esc(r.net_title)}"` : ''}>${dash(r.net)}${r.net_dot ? ' <span class="dot l"></span>' : ''}</td>` +
  `<td class="${r.window_muted ? 'muted' : ''}"${r.window_title ? ` title="${esc(r.window_title)}"` : ''}>${dash(r.window)}${r.window_sub ? `<span class="sub">${esc(r.window_sub)}</span>` : ''}</td>` +
  `<td class="num">${dash(r.window_price)}${r.window_delta ? `<span class="sub ${gaClass(r.window_delta_class)}">${esc(r.window_delta)}</span>` : ''}</td></tr>`;
const gaLines = lines => `<div class="breakdown">${(lines || []).map(([k, v, note, cls, dot]) => `<div><span>${esc(k)}</span><b>${esc(v)}` +
  `${DOTS[dot] ? ` <span class="dot ${DOTS[dot]}"></span>` : ''}${note ? ` <span class="${gaClass(cls)}">${esc(note)}</span>` : ''}</b></div>`).join('')}</div>`;
// The rate card ("Your farming rate"), the one place sessions show (SPEC §3.4E.7): a block per character, its lines
// (the open candidate faded, then the last sessions, how each ended on hover), Clear by an active override's head,
// and the Manual override input with Save (and Clear) where the engine offers one (M17, D85).
const gaLine = l => `<div${l.open ? ' style="opacity:.75"' : ''}${l.title ? ` title="${esc(l.title)}"` : ''}>${esc(l.text)}</div>`;
const gaClearBtn = (b, key) => `<button class="btn" type="button" data-ga-clear="${esc(b.char)}" data-ga-key="${esc(key)}">Clear</button>`;
const gaOverride = (b, key) => !b.override ? '' : `<div style="margin-top:6px">Manual override: ` +
  `<input class="select" type="text" inputmode="numeric" size="4" data-ga-rate="${esc(b.char)}" placeholder="${esc(b.override.placeholder)}" aria-label="Manual items per hour for ${esc(b.char)}"> items/hr ` +
  `<button class="btn" type="button" data-ga-save="${esc(b.char)}" data-ga-key="${esc(key)}">Save</button>${b.override.clear ? ' ' + gaClearBtn(b, key) : ''}` +
  `${b.override.note ? `<span class="sub">${esc(b.override.note)}</span>` : ''}</div>`;
const gaRateCard = (c, key) => `<div class="card"><div style="padding:10px 14px 0">${(c.blocks || []).map(b => {
  const head = b.kind === 'none' || b.kind === 'ineligible' ? `<div class="muted">${esc(b.head)}</div>`
    : `<div><b>${esc(b.head)}</b> <span class="muted">${esc(b.sub)}</span>${b.clear ? ' ' + gaClearBtn(b, key) : ''}</div>`;
  const lines = (b.lines || []).length ? `<div class="muted" style="font-size:12px;margin:4px 0 0 12px">${b.lines.map(gaLine).join('')}</div>` : '';
  return `<div style="margin-bottom:10px">${head}${lines}${b.foot ? `<div class="sub" style="margin-left:12px">${esc(b.foot)}</div>` : ''}${gaOverride(b, key)}</div>`;
}).join('')}</div></div>`;
// The detail below the table for the selected row: price card, rate card, market activity, gross / net per unit / net,
// the deposit legend, then the line standing in for the price history (M16's compact form, SPEC §3.4E.8).
// The rate card picks the item's blocks (only the picked character's) and the row's gross and net lines.
function gaDetail(d, rows, key, char) {
  const x = (d.details || {})[key], row = rows.find(r => String(r.key) === key);
  if (!x || !row) return '<div class="empty" style="border-top:1px solid var(--border)">Select a row to see its price and your rate.</div>';
  const blocks = ((d.rate_cards || {})[key] || { blocks: [] }).blocks.filter(b => !char || b.char === char);
  const card = { blocks, lines: row.card_lines || [] };
  const formulas = [...card.lines.slice(0, 1), ...(x.net_unit ? [['Net per unit', x.net_unit]] : []), ...card.lines.slice(1)];
  return `<div class="card-h" style="border-top:1px solid var(--border)"><b>${esc(x.title)}</b><span class="muted">${esc(x.subtitle)}</span></div>` +
    `<div class="detail"><div><div class="h">Price</div>${gaLines(x.price)}<div class="h">Your farming rate</div>${gaRateCard(card, key)}</div>` +
    `<div><div class="h">Market activity</div><div class="card">${pfTable(MARKET_COLS, d.help || {}, [`<tr>${marketCells(x.market)}</tr>`])}</div>` +
    `${formulas.length ? `<div style="margin-top:10px">${breakdown(formulas)}</div>` : ''}<div class="h">${esc(x.deposit)}</div>` +
    `<div class="muted" style="margin-top:10px">${esc(x.history)}</div></div></div>`;
}
// A view's rows: each shared row (sent once) in the view's key order, with the view's differing cells laid over it.
function gaViewRows(d, view) {
  const shared = Object.fromEntries((d.rows || []).map(r => [String(r.key), r]));
  return (view.keys || []).map(k => ({ ...shared[String(k)], ...((view.cells || {})[String(k)] || {}) }));
}
// The whole page: the freshness line, the header, the filters, an alert, the table, the footers and the detail.
function gaPage(d, values, id) {
  const view = (d.by_char || {})[values.character || ''] || (d.by_char || {})[''];
  if (!view) return '<div class="empty">Nothing to show for this market.</div>';
  const rows = gaViewRows(d, view);
  const help = d.help || {}, sort = state.sort[id] || {}, selected = state.selected[id] || d.selected;
  const shown = sortRows(id, gaShown(d, rows, values));
  const head = GA_COLS.map(([t, num, key]) => `<th class="${num ? 'num ' : ''}${key ? 'sort' : ''}${key && sort.key === key ? ' sorted' + (sort.asc ? ' asc' : '') : ''}"` +
    `${key ? ` data-key="${key}"` : ''}${help[t] ? ` title="${esc(help[t])}"` : ''}>${esc(t)}</th>`).join('');
  const search = String(values.search || '');
  const empty = search ? d.no_match.split('{q}').join(search) : d.no_match_filters;
  const body = !rows.length ? `<tr><td colspan="${GA_COLS.length}" class="muted">Nothing to show for this market.</td></tr>`
    : shown.length ? shown.map(r => gaRow(r, selected)).join('') : `<tr><td colspan="${GA_COLS.length}" class="muted" style="white-space:normal">${esc(empty)}</td></tr>`;
  const last = d.no_rates ? `<tr><td colspan="${GA_COLS.length}" class="muted">${esc(d.no_rates)}</td></tr>` : '';
  const alert = gaOnly(values) && view.alert ? `<div class="alert info" style="margin:0;border-radius:0;border-width:0 0 1px 4px"><span class="grow"><b>${esc(view.alert.title)}</b><span class="sub">${esc(view.alert.text)}</span></span></div>` : '';
  return `<div class="ga"><div class="fresh" style="margin:10px 14px 0">${gaSegments(d.fresh).join(' · ')}</div>` +
    `<div class="card-h"><b>Farmable materials</b><span class="muted">${esc(d.header)}</span></div>${gaFilters(d, view, values)}${alert}` +
    `<div class="scrollx"><table><thead><tr>${head}</tr></thead><tbody>${body}${last}</tbody></table></div>` +
    `<div class="foot">${gaSegments(gaOnly(values) ? view.foot : view.foot_all).join('<span class="muted">·</span>')}</div>` +
    `<div class="foot note">${esc(d.note)}${d.default_note ? ` ${esc(d.default_note)}` : ''}</div>${gaDetail(d, rows, selected, values.character || "")}</div>`;
}
// Gathering's own controls: the category checkboxes, the toggle, row selection and sorting (the rest are data-filter).
function gaBind(id, card, values) {
  card.querySelectorAll('input[data-gcat]').forEach(el => { el.onchange = () => { values['cat_' + el.dataset.gcat] = el.checked ? '1' : '0'; render(id); }; });
  card.querySelectorAll('input[data-gonly]').forEach(el => { el.onchange = () => { values['only_' + (values.character || '')] = el.checked ? '1' : '0'; render(id); }; });
  card.querySelectorAll('tr[data-select]').forEach(tr => { tr.onclick = e => { if (e.target.closest('select, button, input, a')) return; state.selected[id] = tr.dataset.select; render(id); }; });
  card.querySelectorAll('th[data-key]').forEach(th => { th.onclick = () => toggleSort(id, th.dataset.key); });
  card.querySelectorAll('button[data-ga-save]').forEach(btn => { btn.onclick = () => setManualRate(id, btn.dataset.gaSave, btn.dataset.gaKey, btn.parentElement.querySelector('input[data-ga-rate]').value, btn); });
  card.querySelectorAll('button[data-ga-clear]').forEach(btn => { btn.onclick = () => setManualRate(id, btn.dataset.gaClear, btn.dataset.gaKey, null, btn); });
}
// Save or clear a manual farming rate (SPEC §3.4E.5, SEC12, D85): AHSync checks the value, stores it and rebuilds
// the Gathering page, which is then reloaded. What was typed goes as typed (a number when it reads as one), so
// AHSync refuses "fast" or 12.5 with its reason instead of the page guessing; null clears.
async function setManualRate(id, char, key, typed, el) {
  el.disabled = true;
  const n = Number(typed), value = typed === null ? null : (String(typed).trim() !== '' && Number.isFinite(n) ? n : typed);
  try {
    const r = await post('/api/manual_rate', { char, key: Number(key), items_per_hour: value });
    if (r && r.status === 200) { notice(value === null ? 'Manual rate cleared.' : 'Manual rate saved.', 'ok'); load(id); }
    else if (r) notice(`Not saved (${r.body.message || r.body.error || r.status}).`, 'warn');
  } catch (e) {
    notice("AHSync isn't answering. Is it still running?", 'warn');
  }
  el.disabled = false;
}

    // Research only (D71): the engine's notice when no character has Enchanting; the rows are the same either way.
    notice: d => d.notice ? `<div class="alert info" style="margin:0;border-radius:0;border-width:0 0 1px 4px"><span class="grow"><b>${esc(d.notice.title)}:</b> ${esc(d.notice.text)}</span></div>` : '',
    cols: [['Item', 0, null], ['ilvl', 1, 'ilvl'], ['Buy', 1, 'buy'], ['Expected mats', 0, null], ['EV', 1, 'ev'], ['Profit', 1, 'profit'],
           ...MARKET_COLS, ['Risk', 1, 'risk'], ['Price age', 1, 'price_age']],
    row: r => `<tr><td>${item(r.item, r.quality)}</td><td class="num">${esc(r.ilvl)}</td><td class="num">${dash(r.buy)}</td>` +
              `<td class="muted">${esc(r.mats)}</td><td class="num">${dash(r.ev)}</td>${profitCell(r)}${marketCells(r)}${riskCell(r)}` +
              `<td class="num">${dash(r.price_age)}</td></tr>`,
    filters: [
      { id: 'search', label: null, kind: 'search', placeholder: 'Search items…', test: (r, v) => !v || String(r.item).toLowerCase().includes(v.toLowerCase()) },
      // Thresholds are copper constants compared with the row's engine-made sort.profit (no arithmetic).
      { id: 'minProfit', label: 'Min profit', options: [['', 'Any'], ['1', 'Profitable'], ['100', '1s'], ['200', '2s'], ['1000', '10s'], ['10000', '1g']],
        test: (r, v) => v === '' || r.sort.profit >= Number(v) },
      { id: 'quality', label: 'Quality', options: [['', 'All'], ['2', 'Uncommon+'], ['3', 'Rare+'], ['4', 'Epic+']],
        test: (r, v) => v === '' || r.quality >= Number(v) },
      daysFilter,
    ],
  },
  craft: {
    footer: d => esc(d.footer || ''),
    lede: 'The recipes your characters know that are worth crafting now (SPEC §3.4B), whether or not you have the mats; the footer says why the others are not listed. Each row lists its mats, with mail to bring your own to the crafter. <b>Source</b>: <span class="pos">Owned</span> = all mats from your stock; <span class="amber">AH</span> = all mats bought; Mixed = your stock topped up from the AH; <b>+ crafted</b> = one of your characters makes a reagent first. <b>Mats each / total</b> is the gold to buy the mats you\'re missing, per craft and for all crafts ("—" when you already own every mat). Profit counts owned mats at their <b>hold value</b>.',
    cols: [['Product', 0, null], ['Recipe known by', 0, null], ['Source', 0, null], ['Crafts', 1, 'crafts'], ['Mats each', 1, null],
           ['Mats total', 1, 'mats_total'], ['Value each', 1, 'value_each'], ['Expected profit', 1, 'profit'], ...MARKET_COLS,
           ['Risk', 1, 'risk'], ['Cooldown', 0, null]],
    row: r => `<tr><td>${item(r.product, r.quality)}${(r.lines || []).map(l => `<span class="sub">${esc(l)}</span>`).join('')}` +
              `${r.note ? `<span class="sub">${esc(r.note)}</span>` : ''}</td><td>${esc(r.crafter)}</td>` +
              `<td class="${sourceClass(r.source)}">${esc(r.source)}</td><td class="num">${esc(r.crafts)}</td><td class="num">${dash(r.mats_each)}</td>` +
              `<td class="num">${dash(r.mats_total)}</td><td class="num">${dash(r.value_each)}</td>${profitCell(r)}${marketCells(r)}${riskCell(r)}` +
              `<td class="${r.cooldown === 'ready' ? 'pos' : ''}">${esc(r.cooldown)}</td></tr>`,
    filters: [
      { id: 'search', label: null, kind: 'search', placeholder: 'Search products…', test: (r, v) => !v || String(r.product).toLowerCase().includes(v.toLowerCase()) },
      { id: 'profession', label: 'Profession', fromRows: 'profession', test: (r, v) => v === '' || r.profession === v },
      { id: 'source', label: 'Source', options: [['', 'All'], ['Owned', 'Owned'], ['AH', 'AH'], ['Vendor', 'Vendor'], ['Mixed', 'Mixed']],
        test: (r, v) => v === '' || r.source === v || String(r.source).startsWith(v + ' ') },
      daysFilter,
    ],
  },
};

// ---------- state ----------
const state = { page: 'portfolio', market: '', sort: {}, filters: {}, data: {}, selected: {} };
const storage = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- page chrome: every page, in the mockup's order ----------
const ORDER = [['Portfolio', 'portfolio'], ['Today', 'today'], ['Week', 'week'], ['On the AH', 'on_ah'], ['Disenchant', 'disenchant'], ['Craft', 'craft'], ['Flip', 'flip'],
               ['Gathering', 'gathering'], ['Inventory', 'inventory'], ['History', 'history'], ['Rules', 'rules'], ['Characters', 'characters'], ['Status', 'status']];
const nav = document.getElementById('nav');
const main = document.getElementById('main');
ORDER.forEach(([name, id]) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'tab'); b.type = 'button'; b.dataset.page = id;
  b.innerHTML = `<span>${esc(name)}</span>${LIVE[id] ? '' : '<span class="soon">later</span>'}`;
  b.onclick = () => { location.hash = name; };
  nav.appendChild(b);
});
const titleOf = id => ORDER.find(([, i]) => i === id)[0];
const idOfHash = () => { let n = ''; try { n = decodeURIComponent(location.hash.slice(1)); } catch (e) { n = ''; } const hit = ORDER.find(([name, id]) => name === n || id === n); return hit ? hit[1] : null; };

function show(id) {
  state.page = id;
  storage.set('ahsync-page', id);
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.page === id)));
  if (!LIVE[id]) {
    main.innerHTML = `<h1>${esc(titleOf(id))}</h1><p class="lede">Coming in a later milestone.</p>`;
    setBuilt(null);
    setGold(null);
    return;
  }
  main.innerHTML = `<h1>${esc(titleOf(id))}</h1><p class="lede">${LIVE[id].lede}</p><div class="card" id="card"><div class="empty">Loading…</div></div>`;
  load(id);
}

// ---------- data ----------
async function load(id) {
  const market = state.market;
  let res, body;
  try {
    res = await fetch(`/api/views/${encodeURIComponent(id)}?market=${encodeURIComponent(market)}`, { cache: 'no-store' });
    body = await res.json();
  } catch (e) {
    return renderMessage(id, 'AHSync isn\'t answering. Is it still running?');
  }
  if (state.page !== id || state.market !== market) return;     // the user moved on meanwhile
  if (!res.ok) setGold(null);
  if (res.status === 404 && body.error === 'no_refresh_yet') {
    setBuilt(null);
    return renderMessage(id, 'No numbers yet: the first full refresh hasn\'t finished. They appear here when it does, or press Refresh now.');
  }
  if (!res.ok) return renderMessage(id, `Couldn't load this page (${esc(body.error || res.status)}).`);
  state.data[id] = body.data;
  setBuilt(body.built, body.prices_newer);
  setGold(body.data && body.data.gold);
  render(id);
}

// The gold pill (SPEC §3.5, D74): the engine's text, on the pages whose response carries `gold` (not Rules, Characters, Status).
function setGold(text) {
  const pill = document.getElementById('goldpill');
  pill.hidden = !text;
  pill.textContent = text || '';
}

function renderMessage(id, text) {
  if (state.page !== id) return;
  const card = document.getElementById('card');
  if (card) card.innerHTML = `<div class="empty">${text}</div>`;
}

function setBuilt(builtMs, pricesNewer) {
  const pill = document.getElementById('built');
  pill.hidden = builtMs === null || builtMs === undefined;
  pill.classList.toggle('amber', !!pricesNewer);
  if (!pill.hidden) pill.textContent = 'numbers from ' + new Date(builtMs).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) +
    (pricesNewer ? ' · prices newer than numbers · Refresh now' : '');      // IU2
}

// ---------- table ----------
function render(id) {
  const spec = LIVE[id], raw = state.data[id] || { rows: [], hidden: 0 };
  const card = document.getElementById('card');
  if (!card) return;
  const values = state.filters[id] || (state.filters[id] = { ...(spec.defaults || {}) });
  const data = spec.pick ? spec.pick(raw, values) : raw;
  if (spec.render) {
    card.innerHTML = spec.render(data, values, id);
    if (spec.bind) spec.bind(id, card, values);
    bindControls(id, card, values);
    return;
  }
  const rows = Array.isArray(data.rows) ? data.rows : [];
  const selected = state.selected[id] || null;
  const shown = sortRows(id, rows.filter(r => spec.filters.every(f => f.test(r, values[f.id] ?? ''))));
  const sort = state.sort[id] || {};
  // Header tooltips come with the data, from engine/views.py (SPEC §3.5): one text per column name.
  const help = data.help || {};
  const head = spec.cols.map(([t, num, key]) => `<th class="${num ? 'num ' : ''}${key ? 'sort' : ''}${key && sort.key === key ? ' sorted' + (sort.asc ? ' asc' : '') : ''}"${key ? ` data-key="${key}"` : ''}${help[t] ? ` title="${esc(help[t])}"` : ''}>${esc(t)}</th>`).join('');
  // SPEC GAP: §3.5 does not say what "hidden" counts for these pages; shown as the engine gives it, like the Today footer.
  const hidden = spec.footer ? `<div class="card-h"><b>${esc(titleOf(id))}</b><span class="muted">${spec.footer(data, values)}</span></div>`
    : data.hidden ? `<div class="card-h"><b>${esc(titleOf(id))}</b><span class="muted">${esc(data.hidden)} hidden</span></div>` : '';
  const body = rows.length === 0
    ? `<div class="empty">Nothing to show for this market.</div>`
    : shown.length === 0 ? `<div class="empty">No rows match the filters.</div>`
    : `<div class="scrollx"><table><thead><tr>${head}</tr></thead><tbody>${shown.map(r => rowHtml(spec, r, selected)).join('')}</tbody></table></div>`;
  card.innerHTML = (spec.above ? spec.above(data) : '') + hidden + filterBar(id, rows) + (spec.notice ? spec.notice(data) : '') + body + (spec.below ? spec.below(data, values, selected) : '');
  card.querySelectorAll('tr[data-select]').forEach(tr => {
    tr.onclick = e => {
      if (e.target.closest('select, button, input, a')) return;      // a control in the row keeps its focus (D55)
      state.selected[id] = tr.dataset.select; render(id);
    };
  });
  card.querySelectorAll('th[data-key]').forEach(th => { th.onclick = () => toggleSort(id, th.dataset.key); });
  bindControls(id, card, values);
}

// The page's controls: filters, Skip, rules, reserves, the item search and the Risk tolerance dropdown.
function bindControls(id, card, values) {
  card.querySelectorAll('[data-filter]').forEach(el => {
    el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', () => { values[el.dataset.filter] = el.value; render(id); refocus(el.dataset.filter); });
  });
  card.querySelectorAll('[data-skip]').forEach(btn => { btn.onclick = () => skip(btn.dataset.skip, btn); });
  card.querySelectorAll('button[data-rule]').forEach(btn => { btn.onclick = () => setRule(id, btn.dataset.ruleKey, btn.dataset.rule, btn); });
  card.querySelectorAll('select[data-rule-key]').forEach(sel => { sel.onchange = () => sel.value && setRule(id, sel.dataset.ruleKey, sel.value, sel); });
  card.querySelectorAll('select[data-reserve-key]').forEach(sel => { sel.onchange = () => sel.value && setReserve(id, sel); });
  card.querySelectorAll('input[data-item-search]').forEach(inp => { inp.oninput = () => searchItems(id, card, inp.value); });
  card.querySelectorAll('select[data-risk]').forEach(sel => { sel.onchange = () => setRisk(id, sel); });
}

// Set the risk tolerance from the Portfolio page (SPEC §3.5, SEC11, D79): AHSync rewrites config.toml's line and
// re-runs the allocation; the page then reloads the new numbers.
async function setRisk(id, sel) {
  sel.disabled = true;
  try {
    const r = await post('/api/risk_tolerance', { risk_tolerance: Number(sel.value) });
    if (r && r.status === 200) { notice('Risk tolerance saved: the allocation was re-run.', 'ok'); load(id); }
    else if (r) notice(`Not saved (${r.body.message || r.body.error || r.status}).`, 'warn');
  } catch (e) {
    notice("AHSync isn't answering. Is it still running?", 'warn');
  }
  sel.disabled = false;
}

// Set an item rule from Needs a decision (SPEC §3.4.2, D43): AHSync stores it, re-plans and rewrites the plan file.
async function setRule(id, key, rule, el) {
  el.disabled = true;
  try {
    const r = await post('/api/rule', { key: Number(key), rule });
    if (r && r.status === 200) { notice({ keep: 'Kept: its record starts fresh.', none: 'Rule cleared.' }[rule] || 'Blacklisted: the plan no longer buys or crafts it.', 'ok'); load(id); }
    else if (r) notice(`Not saved (${r.body.error || r.status}).`, 'warn');
  } catch (e) {
    notice("AHSync isn't answering. Is it still running?", 'warn');
  }
  el.disabled = false;
}

// Rules: search items to blacklist (D54). The answer comes from GET /api/items; the choice posts to /api/rule.
let searchTimer = null;
function searchItems(id, card, text) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const box = card.querySelector('[data-item-results]');
    if (!box) return;
    let items = [];
    try {
      const res = await fetch('/api/items?q=' + encodeURIComponent(text));
      if (res.ok) items = (await res.json()).items || [];
    } catch (e) { items = []; }
    box.innerHTML = !items.length ? (text.trim().length >= 2 ? '<div class="empty">No item by that name.</div>' : '') :
      `<div class="scrollx"><table><tbody>${items.map(i => `<tr><td>${item(i.name, i.quality)}</td>` +
        `<td><select class="btn" data-rule-key="${esc(i.key)}" title="Blacklist it"><option value="">Blacklist…</option>` +
        `<option value="no_buy">Don't buy or craft</option><option value="ignore">Ignore completely</option></select></td></tr>`).join('')}</tbody></table></div>`;
    box.querySelectorAll('select[data-rule-key]').forEach(sel => { sel.onchange = () => sel.value && setRule(id, sel.dataset.ruleKey, sel.value, sel); });
  }, 250);
}

// Keep an item for one character from Inventory (SPEC §3.4.3, D52, SEC9): AHSync stores it, re-plans and tells the addon.
async function setReserve(id, sel) {
  let qty = sel.value;
  if (qty === 'n') {
    const typed = window.prompt('Keep how many?', '1');
    if (typed === null || !/^\d+$/.test(typed.trim()) || Number(typed) < 1) { sel.value = ''; return; }
    qty = typed.trim();
  }
  sel.disabled = true;
  try {
    const r = await post('/api/reserve', { char: sel.dataset.reserveChar, key: Number(sel.dataset.reserveKey), qty: Number(qty) });
    if (r && r.status === 200) { notice(qty === '0' ? 'Selling it normally again.' : 'Kept: the plan leaves it alone.', 'ok'); load(id); }
    else if (r) notice(`Not saved (${r.body.error || r.status}).`, 'warn');
  } catch (e) {
    notice("AHSync isn't answering. Is it still running?", 'warn');
  }
  sel.disabled = false;
}

// A table row: pages with `selectKey` get a clickable row that selects it (Inventory's item detail).
function rowHtml(spec, r, selected) {
  if (!spec.selectKey) return spec.row(r);
  const key = String(spec.selectKey(r));
  return `<tr data-select="${esc(key)}"${key === selected ? ' class="selected"' : ''}>${spec.row(r)}</tr>`;
}

// Mark a plan action skipped (SPEC §3.4.1); the next refresh re-plans around it.
async function skip(actionId, btn) {
  btn.disabled = true;
  try {
    const r = await post('/api/skip', { action_id: actionId });
    if (r && r.status === 200) notice(r.body.skipped ? 'Skipped: the next refresh plans without it.' : 'That action is no longer open.', 'ok');
    else if (r) notice(`Skip refused (${r.body.error || r.status}).`, 'warn');
  } catch (e) {
    notice('AHSync isn\'t answering. Is it still running?', 'warn');
  }
}

function refocus(filterId) {
  const el = document.querySelector(`input[data-filter="${filterId}"]`);
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function filterBar(id, rows) {
  const values = state.filters[id];
  const parts = LIVE[id].filters.map(f => {
    const v = values[f.id] ?? '';
    if (f.kind === 'search') return `<input class="select search" type="search" data-filter="${f.id}" placeholder="${esc(f.placeholder)}" value="${esc(v)}">`;
    const options = f.options || (f.fromData ? (state.data[id] || {})[f.fromData] : optionsFromRows(rows, f.fromRows));
    if (!options) return '';
    return `<label>${esc(f.label)} <select class="select" data-filter="${f.id}">${options.map(([val, text]) =>
      `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(text)}</option>`).join('')}</select></label>`;
  });
  return `<div class="filters">${parts.join('')}</div>`;
}

function optionsFromRows(rows, field) {
  const seen = [...new Set(rows.map(r => r[field]).filter(v => typeof v === 'string' && v))].sort();
  return seen.length ? [['', 'All'], ...seen.map(v => [v, v])] : null;
}

// Sort by the engine's numeric sort keys only; equal keys keep the served (engine) order.
function sortRows(id, rows) {
  const sort = state.sort[id];
  if (!sort) return rows;
  const indexed = rows.map((r, i) => [r, i]);
  indexed.sort(([a, i], [b, j]) => {
    const x = a.sort ? a.sort[sort.key] : undefined, y = b.sort ? b.sort[sort.key] : undefined;
    if (x !== y) {
      if (x === undefined || x === null) return 1;
      if (y === undefined || y === null) return -1;
      return (x < y) === sort.asc ? -1 : 1;
    }
    return i < j ? -1 : 1;
  });
  return indexed.map(([r]) => r);
}

function toggleSort(id, key) {
  const cur = state.sort[id];
  state.sort[id] = cur && cur.key === key ? { key, asc: !cur.asc } : { key, asc: false };
  render(id);
}

// ---------- writes (POST + token; SPEC §3.5 Security) ----------
async function post(path, payload) {
  const res = await fetch(path, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json', 'X-AHSync-Token': TOKEN }, body: JSON.stringify(payload || {}) });
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (res.status === 403 && body.reload) {
    notice('AHSync was restarted: reload this page.', 'warn', true);
    return null;
  }
  return { status: res.status, body };
}

function notice(text, kind, reload) {
  const el = document.getElementById('notice');
  el.hidden = false;
  el.className = 'pill ' + (kind || '');
  el.innerHTML = esc(text) + (reload ? ' <a href="" id="reload">Reload</a>' : '');
}

document.getElementById('refresh').onclick = async () => {
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  try {
    const r = await post('/api/refresh');
    if (r && r.status === 202) notice('Full refresh queued: the numbers update when it finishes.', 'ok');
    else if (r) notice(`Refresh refused (${r.body.error || r.status}).`, 'warn');
  } catch (e) {
    notice('AHSync isn\'t answering. Is it still running?', 'warn');
  } finally {
    btn.disabled = false;
  }
};

// ---------- markets ----------
async function loadMarkets() {
  const select = document.getElementById('market');
  try {
    const res = await fetch('/api/markets', { cache: 'no-store' });
    const body = await res.json();
    const saved = storage.get('ahsync-market');
    state.market = body.markets.includes(saved) ? saved : body.default;
    select.innerHTML = body.markets.map(m => `<option value="${esc(m)}"${m === state.market ? ' selected' : ''}>${esc(m)}</option>`).join('');
  } catch (e) {
    notice('AHSync isn\'t answering. Is it still running?', 'warn');
  }
  select.onchange = () => { state.market = select.value; storage.set('ahsync-market', select.value); state.data = {}; state.selected = {}; show(state.page); };
}

window.addEventListener('hashchange', () => show(idOfHash() || state.page));
loadMarkets().then(() => {
  const saved = storage.get('ahsync-page');
  show(idOfHash() || (ORDER.some(([, id]) => id === saved) ? saved : 'portfolio'));
});
</script>
</body>

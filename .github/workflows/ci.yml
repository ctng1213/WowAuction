# CI (SPEC §3.7.12): the tests on Windows and macOS, then the app's build and, on a v* tag, the pre-release.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS build (no Release is made)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]       # macos-15 is arm64; macos-latest moved to macOS 26 (SPEC §3.7.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the test tools
        run: python -m pip install -r requirements-dev.txt

      # Lua 5.1, as WoW runs (CLAUDE.md). The action builds it from source; on Windows it needs MSVC.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - id: lua
        uses: leafo/gh-actions-lua@v13
        continue-on-error: ${{ runner.os == 'macOS' }}
        with:
          luaVersion: "5.1.5"

      - name: Lua 5.1 from Homebrew (fallback when the action failed)
        if: runner.os == 'macOS' && steps.lua.outcome == 'failure'
        run: |
          brew install lua@5.1
          echo "$(brew --prefix lua@5.1)/bin" >> "$GITHUB_PATH"

      - name: Put lua5.1 on PATH
        shell: bash
        run: |
          lua_bin="$(command -v lua5.1 || command -v lua)"
          dir="$(dirname "$lua_bin")"
          if [ -f "$dir/lua.exe" ]; then cp "$dir/lua.exe" "$dir/lua5.1.exe";
          elif [ ! -e "$dir/lua5.1" ]; then ln -s "$dir/lua" "$dir/lua5.1"; fi
          lua5.1 -v

      - name: Tests (suite, invariants, engine coverage, Lua)
        shell: pwsh
        run: ./tools/test.ps1

  # The app, built on Windows and macOS (SPEC Â§3.7.12). tools/build.py decides the signing mode and runs every
  # command, so this stays thin. Pull requests build too (unsigned), so a change to the packaging is built before
  # it merges. The signing secrets are secrets of the `signing` environment, which may deploy only from main and
  # v* tags: only the macOS leg of a main, tag or manual run names it, so a branch or pull request run never has
  # them. Within the job they reach the policy and build steps only (tools/build.py keeps them from every
  # command but openssl).
  build:
    needs: test
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ahsync-windows
            files: dist/AHSync-*-windows-x64-setup.exe
          - os: macos-15
            artifact: ahsync-macos
            files: |
              dist/AHSync-*-macos-arm64.dmg
              dist/AHSync-*-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    environment: >-
      ${{ matrix.os == 'macos-15' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch') && 'signing' || '' }}
    timeout-minutes: 90
    outputs:
      release: ${{ steps.policy.outputs.release }}   # the same on both legs
    env:
      SIGN_INPUT: ${{ inputs.sign }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                     # a main build must see the v* tags (the preflight's trigger)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the app packages and PyInstaller
        run: python -m pip install -r requirements-app.txt "pyinstaller==6.22.*"

      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Signing policy
        id: policy
        run: python tools/build.py policy
        env:
          MACOS_CERT_P12: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.MACOS_CERT_P12 || '' }}
          MACOS_CERT_PASSWORD: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.MACOS_CERT_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.APPLE_TEAM_ID || '' }}
          NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.NOTARY_ISSUER_ID || '' }}
          NOTARY_KEY_P8: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.NOTARY_KEY_P8 || '' }}

      - name: Build
        run: python tools/build.py build "${{ steps.policy.outputs.version }}" --mode "${{ steps.policy.outputs.mode }}"
        env:
          MACOS_CERT_P12: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.MACOS_CERT_P12 || '' }}
          MACOS_CERT_PASSWORD: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.MACOS_CERT_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.APPLE_TEAM_ID || '' }}
          NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.NOTARY_ISSUER_ID || '' }}
          NOTARY_KEY_P8: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-15' && secrets.NOTARY_KEY_P8 || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # A tag publishes a pre-release with both builds and SHA256SUMS (SPEC Â§3.7.10); promote.yml makes it GA.
  release:
    needs: build
    if: needs.build.outputs.release == 'true'          # tools/build.py policy: a vMAJOR.MINOR.PATCH tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python tools/build.py release "$TAG"

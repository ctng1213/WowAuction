<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHSync Dashboard Mockup</title>
<!--
  Requirements mockup for the AHSync desktop dashboard (SPEC §3.5), served at http://localhost:8765.
  Names, realms and numbers are placeholders. The in-game addon has its own mockup: addon.html.
-->
<style>
  /* WoW-themed dark palette: stone panels, gold trim, Blizzard item-quality colours. Always dark. */
  :root {
    color-scheme: dark;
    --bg: #0e0d0b; --surface: #181612; --surface-2: #221f19; --border: #3d3424; --border-hi: #8a6d2f;
    --text: #ece3cc; --muted: #9b917b; --accent: #ffd100; --accent-bg: #2b2210;
    --pos: #3ddc4f; --neg: #ff4a3d; --amber: #ffb02e; --info: #69ccf0;
    --q0: #9d9d9d; --q1: #ffffff; --q2: #1eff00; --q3: #2f8cff; --q4: #b55cff; --q5: #ff8000;
    --buy: #69ccf0; --post: #ffd100; --de: #b55cff; --craft: #ff8000; --vendor: #9d9d9d;
    --serif: "Friz Quadrata TT", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: radial-gradient(ellipse at 50% -10%, #2a2214 0%, var(--bg) 55%) fixed, var(--bg); }
  a { color: inherit; text-decoration: underline; text-decoration-color: #4a3f2a; text-underline-offset: 2px; }
  a:hover { text-decoration-color: currentColor; }

  .top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap;
         background: linear-gradient(#211c13, #15120d); border-bottom: 2px solid var(--border-hi); box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .brand { font: 700 19px var(--serif); color: var(--text); letter-spacing: .5px; text-shadow: 0 1px 2px #000; }
  .brand span { color: var(--accent); }
  .select { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: #0b0a08; font-size: 13px; }
  .top .grow { flex: 1; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: #0b0a08; white-space: nowrap; }
  .pill.ok { color: var(--pos); border-color: #2c6b32; } .pill.warn { color: var(--amber); border-color: #7a5a1b; } .pill.gold { color: var(--accent); border-color: var(--border-hi); }

  .layout { display: grid; grid-template-columns: 190px 1fr; min-height: calc(100vh - 54px); }
  nav { background: linear-gradient(90deg, #15120d, #110f0b); border-right: 1px solid var(--border); padding: 12px 8px; }
  nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 7px 12px; margin: 2px 0; border: 1px solid transparent; border-radius: 4px;
               background: none; color: var(--text); font: 15px var(--serif); cursor: pointer; }
  nav button:hover { background: var(--surface-2); border-color: var(--border); }
  nav button[aria-selected="true"] { background: linear-gradient(90deg, #3a2c10, #1d170c); color: var(--accent); border-color: var(--border-hi);
                                     box-shadow: inset 3px 0 0 var(--accent); }
  nav .count { color: var(--muted); font: 12px system-ui, sans-serif; }
  main { padding: 20px 24px 48px; min-width: 0; }
  h1 { font: 24px var(--serif); color: var(--accent); margin: 0 0 4px; text-shadow: 0 1px 3px #000; }
  .lede { color: var(--muted); margin: 0 0 16px; max-width: 760px; }
  h3 { font: 16px var(--serif); color: var(--accent); margin: 22px 0 8px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: linear-gradient(#1f1b14, #14120e); border: 1px solid var(--border); border-top: 2px solid var(--border-hi); border-radius: 6px; padding: 12px 14px;
          box-shadow: inset 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,.45); }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .d { color: var(--muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px #000, 0 3px 12px rgba(0,0,0,.5); }
  .card + .card { margin-top: 14px; }
  .card-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: linear-gradient(#241f16, #1a1711); }
  .card-h b { flex: 1; font: 15px var(--serif); color: var(--accent); font-weight: normal; }
  .filters { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filters .search { min-width: 180px; flex: 1; max-width: 260px; }
  .scrollx { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: #d9b54a; padding: 8px 12px; border-bottom: 1px solid var(--border-hi); white-space: nowrap; background: #120f0b; letter-spacing: .3px; }
  th[title] { cursor: help; text-decoration: underline dotted #6b5a32; text-underline-offset: 3px; }
  th.sort::after { content: " ↕"; opacity: .5; } th.sorted::after { content: " ↓"; opacity: 1; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(even) td { background: rgba(255,255,255,.015); }
  tbody tr:hover td { background: #2a2416; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); } .amber { color: var(--amber); }
  .sub { display: block; color: var(--muted); font-size: 12px; white-space: normal; max-width: 520px; }
  .q0 { color: var(--q0); } .q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); }
  .act { display: inline-block; min-width: 52px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .4px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
  .act.buy { color: var(--buy); } .act.post { color: var(--post); } .act.de { color: var(--de); } .act.craft { color: var(--craft); } .act.vendor { color: var(--vendor); } .act.mail { color: var(--info); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot.h { background: var(--pos); } .dot.m { background: var(--amber); } .dot.l { background: var(--muted); }
  .flag { color: var(--neg); font-weight: 700; font-size: 12px; }
  /* Blizzard-style red panel button with gold text */
  .btn { display: inline-block; padding: 3px 12px; border: 1px solid #000; border-radius: 3px; font-size: 12px; cursor: pointer; color: var(--accent);
         background: linear-gradient(#8a1a14, #4d0c09); box-shadow: inset 0 0 0 1px #b2392f, 0 1px 2px #000; text-shadow: 0 1px 1px #000; }
  .btn:hover { background: linear-gradient(#a3221a, #5e0f0b); }
  .btn.primary { background: linear-gradient(#6b5420, #3a2c10); box-shadow: inset 0 0 0 1px #c9a64a, 0 1px 2px #000; }
  .status-done { color: var(--pos); } .status-missed { color: var(--neg); text-decoration: line-through; } .status-partial { color: var(--amber); }

  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 10px; }
  .alert.warn { border-left: 4px solid var(--amber); } .alert.bad { border-left: 4px solid var(--neg); } .alert.info { border-left: 4px solid var(--info); }
  .alert .grow { flex: 1; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; }
  .day { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; min-height: 220px; box-shadow: inset 0 0 0 1px #000; }
  .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px #000, 0 0 12px rgba(255,209,0,.15); }
  .day h4 { margin: 0; font: 15px var(--serif); color: var(--accent); display: flex; justify-content: space-between; }
  .day h4 .muted { font: 12px system-ui, sans-serif; }
  .day .tot { font-size: 12px; margin-bottom: 8px; }
  .chip { border: 1px solid var(--border); border-left: 3px solid; border-radius: 4px; padding: 5px 7px; margin-bottom: 6px; font-size: 12px; background: #0f0d0a; }
  .chip.vendor { border-left-color: var(--vendor); }
  .chip.buy { border-left-color: var(--buy); } .chip.post { border-left-color: var(--post); } .chip.de { border-left-color: var(--de); } .chip.craft { border-left-color: var(--craft); } .chip.mail { border-left-color: var(--info); }
  .chip .t { color: var(--muted); } .chip.done { opacity: .6; } .chip.done .t::before { content: "✓ "; color: var(--pos); }
  .chip.missed { border-left-color: var(--neg); opacity: .8; } .chip.missed .t::before { content: "✗ missed "; color: var(--neg); }
  .chip.hold { border-left-color: var(--amber); border-style: dashed; border-left-style: solid; }
  .act.hold { color: var(--amber); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 12px 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .prof { padding: 6px 14px; }

  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; }
  .heat { display: grid; grid-template-columns: 28px repeat(24, 1fr); gap: 1px; font-size: 10px; }
  .heat div { height: 13px; }
  .heat .lbl { color: var(--muted); height: auto; }
  .legend { font-size: 11px; color: var(--muted); margin-top: 6px; }
  svg.spark { width: 100%; height: 110px; }
  .window { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; margin-bottom: 4px; border: 1px solid var(--border); border-radius: 4px; background: #0f0d0a; }
  .window .rank { font: 16px var(--serif); color: var(--accent); width: 14px; }
  .window b { font-weight: 600; min-width: 130px; }
  .breakdown div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .breakdown span { color: var(--muted); } .breakdown b { font-weight: 600; text-align: right; }
  .chance { color: var(--text); }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 6px; }
    nav button { width: auto; white-space: nowrap; }
    nav .count { display: none; }
    main { padding: 16px; }
    .detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">AH<span>Sync</span></div>
  <span class="select">Market: forever.pvp.horde.us ▾</span>
  <span class="grow"></span>
  <span class="pill" title="Numbers are recomputed at start, once a day after 06:00, or when you press Refresh now. Your in-game changes update the affected items immediately.">numbers from 06:00 · <span class="amber">prices newer</span></span>
  <span class="btn primary" title="Full refresh: recompute every statistic, chance and the plan (about a minute)">⟳ Refresh now</span>
  <span class="pill ok">● synced 14:06 · hour data 2 h old</span>
  <span class="pill gold">Premium via contributor · until 23 Oct</span>
  <span class="pill">SavedVariables read 13:52</span>
</div>

<div class="layout">
  <nav id="nav" role="tablist"></nav>
  <main id="main"></main>
</div>

<script>
// ---------- helpers ----------
function money(c, signed) {
  if (c === null || c === undefined) return '<span class="muted">—</span>';
  const sign = c < 0 ? '−' : (signed ? '+' : '');
  const a = Math.abs(c), g = Math.floor(a / 10000), s = Math.floor(a % 10000 / 100), cp = a % 100;
  const parts = [];
  if (g) parts.push(`${g}<span style="color:#c9a227">g</span>`);
  if (s) parts.push(`${s}<span style="color:#9aa0a6">s</span>`);
  if (cp || !parts.length) parts.push(`${cp}<span style="color:#b8693a">c</span>`);
  return sign + parts.join(' ');
}
const net = c => c === null ? money(null) : `<span class="${c < 0 ? 'neg' : 'pos'}">${money(c, true)}</span>`;
const item = (n, q) => `<a class="q${q}" href="https://auctionhouse.fyi/" title="Open on auctionhouse.fyi">${n}</a>`;
const act = a => `<span class="act ${a}">${a === 'de' ? 'DE' : a.toUpperCase()}</span>`;
// Confidence % (SPEC §3.3.5); letters stand in for this mockup's example values. Dot: ≥ 75 high, ≥ 45 medium, else low.
const conf = c => {
  const p = typeof c === 'number' ? c : { h: 86, m: 63, l: 38 }[c];
  return `<span class="dot ${p >= 75 ? 'h' : p >= 45 ? 'm' : 'l'}"></span>${p}%`;
};
// Market activity per item (SPEC §3.3.6): [estimated sales per day, or null when unavailable; its source; units on the AH now].
// Source: AHF = AHF's volume, est. = estimated from order books (your scans). For disenchant targets it's the main mat's.
const VOL = {
  'Linen Cloth': [48, 'AHF', 93], 'Copper Rod': [6, 'AHF', 14], 'Mithril Spurs': [3, 'AHF', 4], 'Bolt of Silk Cloth': [22, 'AHF', 40],
  'Heavy Grinding Stone': [18, 'est.', 35], 'Broken Fang': [0, 'est.', 0], 'Iron Ore': [31, 'AHF', 120], 'Silk Cloth': [64, 'AHF', 210],
  'Elixir of Agility': [9, 'AHF', 12], 'Pattern: Tuxedo Shirt': [1, 'est.', 2], 'Transmute: Iron to Gold': [5, 'AHF', 6], 'Gold Bar': [5, 'AHF', 6],
  'Runed Copper Rod': [4, 'est.', 3], 'Linen Belt': [null, null, 8], 'Heavy Leather': [7, 'AHF', 60], 'Copper Bar': [40, 'AHF', 150],
  'Scouting Gloves of the Monkey': [210, 'AHF', 400], 'Ridge Cleaver of the Bear': [35, 'AHF', 70], 'Bandit Cinch': [210, 'AHF', 400],
  "Archer's Belt of the Owl": [210, 'AHF', 400], 'Glimmering Mail Bracers': [12, 'est.', 25], 'Bolt of Linen Cloth': [26, 'AHF', 45],
  'Wool Cloth': [70, 'AHF', 140], 'Mageweave Cloth': [55, 'AHF', 120], 'Green items': [210, 'AHF', 400],
  'Mithril Coif': [2, 'AHF', 3], 'Silver Rod': [4, 'est.', 6],
};
const DASH = '<span class="muted">—</span>';
// Est. Sales/Day · Current Supply · Supply/Volume cells. "—" whenever the data can't support a number, never 0 (SPEC §3.3.6).
const activity = n => {
  const v = VOL[n];
  if (!v) return `<td class="num">${DASH}</td>`.repeat(3);
  const [sold, src, supply] = v;
  const soldCell = sold === null
    ? `<td class="num" title="Unavailable: only listing quantities were seen, and those can't tell sales from expiries">${DASH}</td>`
    : `<td class="num">${sold} <span class="muted">${src}</span></td>`;
  const days = sold ? `${(supply / sold).toFixed(1)} days` : DASH;
  return `${soldCell}<td class="num">${supply}</td><td class="num" title="Days of supply at the current sales rate. Not a time-to-sell guarantee">${days}</td>`;
};
// Confidence % per item (SPEC §3.3.5): example values for this mockup.
const CONF = {
  'Linen Cloth': 86, 'Copper Rod': 63, 'Mithril Spurs': 63, 'Bolt of Silk Cloth': 86, 'Heavy Grinding Stone': 58, 'Broken Fang': 52,
  'Scouting Gloves of the Monkey': 82, 'Silk Cloth': 88, 'Elixir of Agility': 66, 'Pattern: Tuxedo Shirt': 38, 'Transmute: Iron to Gold': 64,
  'Gold Bar': 64, 'Runed Copper Rod': 47, 'Linen Belt': 41, 'Heavy Leather': 44, 'Copper Bar': 80, 'Ridge Cleaver of the Bear': 71,
  'Bandit Cinch': 88, "Archer's Belt of the Owl": 79, 'Glimmering Mail Bracers': 38, 'Bolt of Linen Cloth': 77,
  'Wool Cloth': 81, 'Mageweave Cloth': 74, 'Green items': 80, 'Mithril Coif': 60, 'Silver Rod': 52,
};
// Every table that shows a chance uses the same market activity columns, in this order (SPEC §3.5): Chance, with the
// confidence dot inside it (exact confidence % on hover), then Est. Sales/Day, Current Supply and Supply/Volume.
const MARKET = [['Chance', 1], ['Est. Sales/Day', 1], ['Current Supply', 1], ['Supply/Volume', 1]];
const confDot = c => `<span class="dot ${c >= 75 ? 'h' : c >= 45 ? 'm' : 'l'}"></span>`;
const volumeUnknown = n => VOL[n] && VOL[n][0] === null;
const market = (n, P) => (P === null || P === undefined || !CONF[n]
  ? `<td class="num">${pct(P ?? null)}</td>`
  : `<td class="num" title="Confidence ${CONF[n]}%: how much the data behind this chance can be trusted">${P}% ${confDot(CONF[n])}${volumeUnknown(n) ? '<span class="sub">volume unknown</span>' : ''}</td>`) + activity(n);
const pct = p => p === null ? '<span class="muted">—</span>' : p + '%';
const TOTAL_GOLD = 314000; // copper across all characters; risk % is measured against this
const risk = spend => { const r = spend / TOTAL_GOLD * 100; return `<span class="${r > 25 ? 'amber' : 'muted'}">${r.toFixed(1)}%</span>`; };
const paid = c => c === 0 ? '0 <span class="muted">found</span>' : money(c);
// Chance to sell shown on Week chips: each post's (or craft/flip product's) chance in its planned window (SPEC §3.3.2). Mat buys and mail show none.
const WEEK_CHANCE = {
  'Linen Cloth ×20': 92, 'Copper Rod ×5': 58, 'Heavy Grinding Stone ×4': 75, 'Bolt of Silk Cloth ×2': 85, 'Silk Cloth ×40': 88, 'Mithril Spurs': 85,
  'Mageweave Cloth ×20': 78, 'Wool Cloth ×20': 81, 'Runed Copper Rod (Amaya)': 95, 'Runed Copper Rod': 95, 'Heavy Leather ×5': 25, 'Elixir of Agility ×5': 70,
  'Transmute: Iron to Gold': 65, 'Gold Bar': 65, 'Green items ×3': 95, 'Scouting Gloves of the Monkey': 100, 'Copper Bar ×6': 90,
};
// Header tooltips (SPEC §3.5): one text per column name, so a column reads the same on every page.
const HELP = {
  'Action': 'What to do: BUY, POST, DE (disenchant), CRAFT, VENDOR, MAIL or HOLD',
  'Item': 'The item, in its quality colour. Click to open it on auctionhouse.fyi',
  'Qty': 'Units (or crafts) this row is about',
  'Each': 'Per unit: the price you pay, or post at',
  'Total': 'Each × quantity',
  'Expected net': 'What this action adds on average, after fees, deposits and the chance it sells. A chain counts it once, on its first action',
  'Chance': 'Chance it sells in its planned window. The dot is the confidence in that chance: green ≥ 75%, amber ≥ 45%, grey below. Hover a cell for the exact %',
  'Est. Sales/Day': 'Units the market sells per day (last 7 days), with its source: AHF, or est. from order books in your scans. "—" = no sales data',
  'Current Supply': 'Units on the AH now, in the newest scan',
  'Supply/Volume': 'Days of supply: current supply ÷ sales per day. Not a time-to-sell guarantee',
  'Risk': 'Gold this action spends ÷ all your gold. Amber above 25%',
  'Character': 'Which of your characters does it',
  'Record': 'Your own posts of this item over 30 days, and how the plan adjusted',
  'Record (30 d)': 'Your own posts of this item over 30 days, and how the plan adjusted',
  'Owned': 'Units you hold, on which character, and what you paid',
  'ilvl': 'Item level: sets the disenchant results',
  'Buy': 'Cheapest buyout on the AH now',
  'Expected mats': 'Average disenchant results for this quality and item level',
  'EV': 'Expected value of the mats: average results × their sell value',
  'Profit': 'EV − buy price, after fees',
  'Price age': 'How long ago the buy price was seen. Older prices are less likely to still be there',
  'Product': 'What the recipe makes',
  'Recipe known by': 'The character who knows it, and their skill',
  'Source': 'Where the mats come from: Owned, AH, Mixed, + crafted (another character makes a reagent first)',
  'Crafts': 'How many to make: stops where one more would lose money',
  'Mats each': 'Gold for mats you must buy, per craft. "—" = you own them all',
  'Mats total': 'Mats each × crafts',
  'Value each': 'What one product is expected to sell for',
  'Expected profit': 'Average profit after fees and the chance it sells; owned mats count at their hold value',
  'Cooldown': 'When the recipe can be used again',
  'Listed each': 'Your unit price on the AH',
  'Listed total': 'Listed each × quantity',
  'Cost each': 'What one cost you: bought price, or mat cost for a craft. Found items cost 0',
  'Cost total': 'Cost each × quantity',
  'Deposit': 'Deposit paid; lost only if the auction expires',
  'Profit if sold': 'Listed total after the 5% cut, minus cost total',
  'Time left': 'Time until the auction expires',
  'Position': 'Whether your auction is the cheapest, or undercut and by whom',
  'Buy each': 'Price to pay now, per unit',
  'Buy total': 'Buy each × quantity',
  'Sell each': 'Expected sell price per unit in the sell slot',
  'Sell slot': 'When to sell: the peak window the flip is for',
  'Why': 'The pattern behind the flip',
  'Seasonality Strength': '0–100: how predictable the weekly price pattern is, tested on a held-out week. Not how profitable it is. "—" = too little evidence',
  'Expected ROI': 'Expected profit ÷ buy cost. Flips need at least 20%',
  'Paid each': 'What you paid per unit; 0 for items you found',
  'Paid total': 'Paid each × quantity',
  'Worth': 'What it is worth under its best plan',
  'Best selling windows': 'Hours of the week where price × buyers is highest, learned from past weeks',
  'Plan': 'What the plan does with it',
  'Where': 'Bags, bank or mail',
  'When': 'Local time',
  'Event': 'What the addon recorded: Posted, Sold, Paid out, Bought, Crafted, Disenchanted, Expired, Untracked',
  'Price': 'Unit price of the event',
  'Plan action': 'The plan action it matched, if any',
  'Detail': 'More about the event and how it was matched',
  'Last expired': 'When it last expired while cheapest',
  'Kept': 'When you chose Keep',
  'Since then': 'Posts and sales since Keep',
  'Status': 'How it is doing since Keep',
  'Rule': 'The blacklist rule',
  'Effect': 'What the rule changes',
  'Set': 'When the rule was set',
  'From': 'Where it was set: dashboard or addon. The newer change wins',
  'Step': 'Which part of AHSync',
  'What happened': 'The problem',
  'Result': 'What AHSync did about it',
  'Predicted chance': 'Posts grouped by the chance they were given',
  'Posts': 'Resolved posts in the group',

function tr(a, n, q, qty, each, e, P, c, ch, spend, note) {
  return `<tr><td>${act(a)}</td><td>${item(n, q)}${note ? `<span class="sub">${note}</span>` : ''}</td><td class="num">${qty}</td><td class="num">${money(each)}</td><td class="num">${each === null ? money(null) : money(each * qty)}</td><td class="num">${net(e)}</td>${market(n, P)}<td class="num">${risk(spend)}</td><td>${ch}</td><td><span class="btn">Skip</span></td></tr>`;
}
function ahRow(n, q, who, qty, each, costEach, how, deposit, left, position, P) {
  const profit = Math.round(each * qty * 0.95) - costEach * qty;
  return `<tr><td>${item(n, q)}</td><td>${who}</td><td class="num">${qty}</td><td class="num">${money(each)}</td><td class="num">${money(each * qty)}</td><td class="num">${paid(costEach)}</td><td class="num">${money(costEach * qty)}<span class="sub">${how}</span></td><td class="num">${money(deposit)}</td><td class="num">${net(profit)}</td><td>${left}</td><td>${position}</td>${market(n, P)}</tr>`;
}
function deRow(n, ilvl, buy, mats, ev, profit, c, age, P) {
  return `<tr><td>${item(n, 2)}</td><td class="num">${ilvl}</td><td class="num">${money(buy)}</td><td class="muted">${mats}</td><td class="num">${money(ev)}</td><td class="num">${net(profit)}</td>${market(n, P)}<td class="num">${risk(buy)}</td><td class="num ${age.includes('d') ? 'amber' : ''}">${age}</td></tr>`;
}
function crRow(n, q, who, src, crafts, matsEach, value, profit, P, cd, note) {
  const matsTotal = matsEach === null ? null : matsEach * crafts;
  const srcColor = src.startsWith('Owned') ? 'pos' : src.startsWith('AH') ? 'amber' : '';
  return `<tr><td>${item(n, q)}<span class="sub">${note}</span></td><td>${who}</td><td class="${srcColor}">${src}</td><td class="num">${crafts}</td><td class="num">${money(matsEach)}</td><td class="num">${money(matsTotal)}</td><td class="num">${money(value)}</td><td class="num">${net(profit)}</td>${market(n, P)}<td class="num">${risk(matsTotal || 0)}</td><td>${cd}</td></tr>`;
}
function flRow(n, q, qty, buy, sell, slot, why, profit, strength, roi, P) {
  const strengthCell = strength === null
    ? `<td class="num" title="Fewer than 3 weeks of data, or too few held-out closes">${DASH}<span class="sub">insufficient evidence</span></td>`
    : `<td class="num" title="How much better the weekly pattern predicted a held-out week than a flat price">${strength}</td>`;
  return `<tr><td>${item(n, q)}</td><td class="num">${qty}</td><td class="num">${money(buy)}</td><td class="num">${money(buy * qty)}</td><td class="num">${money(sell)}</td><td>${slot}</td><td class="muted">${why}</td><td class="num">${net(profit)}</td>${strengthCell}<td class="num">${roi}%</td>${market(n, P)}<td class="num">${risk(buy * qty)}</td></tr>`;
}
function invRow(n, q, who, where, qty, paidEach, worth, plan, P, windows, sel) {

function windowRow(rank, when, uplift, strength) {

function hRow(when, who, ev, n, q, qty, price, action, detail) {

  return `<tr><td class="muted">${when}</td><td>${who}</td><td class="${cls}">${ev}</td><td>${item(n, q)}</td><td class="num">${qty}</td><td class="num">${money(price)}</td><td>${action}</td><td class="muted">${detail}</td></tr>`;
}
function calRow(bucket, n, predicted, actual) {
  const off = actual - predicted, bad = Math.abs(off) > 15 && n >= 20;
  const bar = (v, c) => `<div class="bar" style="width:160px"><i style="width:${v}%;background:${c}"></i></div>`;
  return `<tr><td>${bucket}</td><td class="num">${n}</td><td class="num">${predicted}%</td><td class="num ${bad ? 'neg' : ''}">${actual}%</td><td class="num ${bad ? 'neg' : 'muted'}">${off > 0 ? '+' : ''}${off} pts</td>
    <td>${bar(predicted, 'var(--muted)')}${bar(actual, bad ? 'var(--neg)' : 'var(--pos)')}</td></tr>`;
}
function ruleRow(n, q, rule, effect, set, from) {
  return `<tr><td>${item(n, q)}</td><td>${rule}</td><td class="muted">${effect}</td><td>${set}</td><td class="muted">${from}</td><td><span class="btn">Clear</span></td></tr>`;
}
function charCard(name, cls, where, gold, profs, recipes, seen) {
  return `<div class="card"><div class="card-h"><b>${name}</b><span class="muted">${cls}</span></div>
    <dl class="kv"><dt>Realm</dt><dd>${where}</dd><dt>Gold (budget)</dt><dd>${money(gold)}</dd><dt>Known recipes</dt><dd>${recipes}</dd><dt>Last seen</dt><dd>${seen}</dd></dl>
    ${profs.map(([p, s, m]) => `<div class="prof"><div style="display:flex;justify-content:space-between"><span>${p}</span><span class="muted">${s} / ${m}</span></div><div class="bar"><i style="width:${s / m * 100}%"></i></div></div>`).join('')}
    <div style="height:10px"></div></div>`;
}
function spark() {
  const pts = Array.from({ length: 60 }, (_, i) => 49 + 6 * Math.sin(i / 4.3) + (i % 14 > 10 ? 5 : 0) + Math.sin(i * 1.7));
  const lo = 38, hi = 64, W = 300, H = 100;
  const xy = pts.map((v, i) => `${(i / 59 * W).toFixed(1)},${(H - (v - lo) / (hi - lo) * H).toFixed(1)}`).join(' ');
  const med = (H - (49 - lo) / (hi - lo) * H).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="30-day price">
    <line x1="0" x2="${W}" y1="${med}" y2="${med}" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/>
    <polyline points="${xy}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
// One 7 × 24 heatmap: 'price' (how), 'sales' (sales_how) or 'supply' (supply_how). Example shapes only.
function heat(kind) {
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const look = {
    price: ['var(--accent)', 'price', (di, h, w) => 1 + 0.04 * Math.sin((h - 14) / 3.8) + (h >= 17 && h <= 21 ? 0.04 : 0) + (di >= 5 ? 0.03 : 0) + (w ? 0.05 : 0), 0.94, 0.2],
    sales: ['var(--pos)', 'sales', (di, h) => Math.max(0.15, 1 + 0.8 * Math.sin((h - 13) / 3.6)) + ((di === 1 || di === 2) && h >= 19 && h <= 22 ? 0.6 : 0) + (di >= 5 ? 0.2 : 0), 0, 2.4],
    supply: ['var(--info)', 'supply', (di, h) => 1 + 0.25 * Math.sin((h - 17) / 3.8) + (di === 1 && h >= 8 && h <= 12 ? 0.3 : 0) + (di >= 5 ? 0.1 : 0), 0.6, 0.9],
  }[kind];
  const [colour, label, f, lo, span] = look;
  let out = '<div class="heat"><div class="lbl"></div>' + Array.from({ length: 24 }, (_, h) => `<div class="lbl">${h % 6 ? '' : h}</div>`).join('');
  days.forEach((d, di) => {
    out += `<div class="lbl">${d}</div>`;
    for (let h = 0; h < 24; h++) {
      const inWindow = (di === 5 && h >= 17 && h <= 20) || (di === 6 && h >= 19 && h <= 21) || (di === 2 && h >= 20 && h <= 21);
      const r = f(di, h, inWindow);
      const a = Math.max(0.06, Math.min(1, (r - lo) / span));
      out += `<div style="background:color-mix(in srgb, ${colour} ${Math.round(a * 100)}%, transparent)${inWindow ? ';outline:1px solid #fff6;outline-offset:-1px' : ''}" title="${d} ${h}:00 ${label} ×${r.toFixed(2)} · 7 weeks"></div>`;
    }
  });
  return out + '</div>';
}
// Daily estimated sales (bars) and median listed supply (line) over 30 days, with one missing day left as a gap.
function daily() {
  const W = 300, H = 90, n = 30, top = 140;
  const sold = Array.from({ length: n }, (_, i) => i === 11 ? null : 48 + 14 * Math.sin(i / 1.1) + (i % 7 >= 5 ? 12 : 0));
  const supply = Array.from({ length: n }, (_, i) => i === 11 ? null : 88 + 18 * Math.sin(i / 2.3));
  const x = i => i * W / n, y = v => H - v / top * H;
  const bars = sold.map((v, i) => v === null ? '' : `<rect x="${(x(i) + 1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(W / n - 2).toFixed(1)}" height="${(H - y(v)).toFixed(1)}" fill="var(--pos)" opacity=".55"/>`).join('');
  const segment = (from, to) => supply.slice(from, to).map((v, i) => `${(x(from + i) + W / n / 2).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily sales and supply">${bars}
    <polyline points="${segment(0, 11)}" fill="none" stroke="var(--info)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <polyline points="${segment(12, n)}" fill="none" stroke="var(--info)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---------- tab switching ----------
const nav = document.getElementById('nav');
const ORDER = ['Today', 'Week', 'On the AH', 'Disenchant', 'Craft', 'Flip', 'Inventory', 'History', 'Rules', 'Characters', 'Status'];
ORDER.map(name => [name, PAGES[name]]).forEach(([name, p]) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'tab'); b.dataset.page = name;
  b.innerHTML = `<span>${name}</span>${p.count !== null ? `<span class="count">${p.count}</span>` : ''}`;
  b.onclick = () => show(name);
  nav.appendChild(b);
});
function show(name) {
  if (!PAGES[name]) name = 'Today';
  document.getElementById('main').innerHTML = PAGES[name].html();
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.page === name));
  try { localStorage.setItem('ahsync-mock-page', name); } catch (e) {}
}
let start = 'Today';
try { start = localStorage.getItem('ahsync-mock-page') || 'Today'; } catch (e) {}

show(decodeURIComponent(location.hash.slice(1)) || start);
